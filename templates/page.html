<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add("js")</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{FULL_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{FULL_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:secure_url" content="{{OG_IMAGE}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TUKSAL Danışmanlık — Kurumlara Özel Deneyimsel Gelişim Programı">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{FULL_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  <meta name="theme-color" content="#10294a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/playfair-display-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v={{BUILD}}">
  <script type="application/ld+json">{{JSONLD}}</script>
</head>
<body class="{{BODY_CLASS}}">
  <a class="skip-link" href="#main">İçeriğe geç</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="{{SITE_NAME}} — ana sayfa">
        <img class="brand-logo" src="assets/img/logo/tuksal-yatay.svg" alt="" width="229" height="46">
      </a>
      <button class="nav-burger" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menüyü aç/kapat"><span></span></button>
{{NAV}}
    </div>
  </header>

  <main id="main">
{{CONTENT}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <a class="brand" href="index.html">
            <img class="brand-logo brand-logo--footer" src="assets/img/logo/tuksal-logo-acik.svg" alt="TUKSAL Danışmanlık" width="183" height="120" loading="lazy">
          </a>
          <p>{{LEGAL_NAME}}<br>{{TAGLINE}}</p>
        </div>
{{FOOTER_NAV}}
        <div data-contact-col hidden>
          <h4>İletişim</h4>
          <ul class="footer-contact">
            <li hidden><span data-address></span></li>
            <li hidden><a href="#" data-phone="0"></a></li>
            <li hidden><a href="#" data-phone="1"></a></li>
            <li hidden><a href="#" data-email></a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span data-year>{{YEAR}}</span> {{SITE_NAME}} — {{LEGAL_NAME}}. Tüm hakları saklıdır.</span>
        <span><a href="kvkk.html">KVKK Aydınlatma Metni</a></span>
      </div>
    </div>
  </footer>

  <script src="assets/js/config.js?v={{BUILD}}"></script>
  <script src="assets/data/etkinlikler.js?v={{BUILD}}"></script>
  <script src="assets/js/main.js?v={{BUILD}}"></script>
</body>
</html>
